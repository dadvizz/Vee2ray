name: Build APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Download libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" -o "V2rayNG/app/libs/libv2ray.aar"

      - name: Build Debug APK
        run: |
          cd V2rayNG
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: v2rayNG-debug
          path: V2rayNG/app/build/outputs/apk/debug/app-debug.apk
