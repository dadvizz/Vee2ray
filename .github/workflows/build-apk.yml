name: Build APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Build & Copy libhevtun
        working-directory: V2rayNG
        run: |
          $ANDROID_HOME/ndk/27.0.12077973/ndk-build -C app/src/main/jni \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=app/src/main/jni/Android.mk \
            NDK_APPLICATION_MK=app/src/main/jni/Application.mk \
            NDK_LIBS_OUT=app/src/main/jniLibs

      - name: Download libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" -o "V2rayNG/app/libs/libv2ray.aar"

      - name: Build Debug APK
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalXray-Debug-APKs
          path: V2rayNG/app/build/outputs/apk/debug/*.apk
